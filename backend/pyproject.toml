[project]
name = "learning-os"
version = "0.1.0"
description = "Personal Learning OS backend"
authors = [
    { name = "Pavel Montoya", email = "pavelmon04@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "openai>=2.53.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
learning-os = "learning_os.main:run"
learning-os-chat = "learning_os.conversation.loop:run"
learning-os-career = "learning_os.career.cli:run"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
